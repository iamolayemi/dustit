name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        run: go vet ./... && go test ./...
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
      - name: Build and attach the DustIt menu bar app
        run: |
          make menubar-zip VERSION="$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" dist/DustIt-*-macOS.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
