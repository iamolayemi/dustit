name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test (unit + end-to-end)
        run: go test -race -coverprofile=coverage.out ./internal/... ./cmd/... && go test -count=1 ./e2e/
      - name: Fuzz the delete guard
        run: go test ./internal/fsx -run '^$' -fuzz FuzzCheckDeletable -fuzztime 30s
      - name: Build
        run: go build -o dustit . && ./dustit --version && ./dustit list

  lint:
    # Type-checks the macOS code from Linux, so it doesn't wait for a Mac runner.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOOS: darwin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5

  menubar:
    name: Menu bar app builds
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make menubar-zip

  goreleaser-check:
    # Needs a Mac: the release runs dustit to generate man pages and completions.
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean
