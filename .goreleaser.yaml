# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: macclean

before:
  hooks:
    - go mod tidy

builds:
  - env: [CGO_ENABLED=0]
    goos: [darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/iamolayemi/macclean/cmd.version={{ .Version }}
      - -X github.com/iamolayemi/macclean/cmd.commit={{ .ShortCommit }}
      - -X github.com/iamolayemi/macclean/cmd.date={{ .Date }}

universal_binaries:
  - replace: false

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ title .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^ci:", "^chore:"]
